sync_images:
  name: 同步产品图
  description: 从米家产品百科抓取缺失的设备实物图，标准化后落地到 www/mi_cards/images。
  fields:
    force:
      name: 强制重抓
      description: 已存在的图片也重新抓取并标准化。
      required: false
      default: false
      selector:
        boolean:
    models:
      name: 指定型号
      description: 型号列表，例如 zimi.waterheater.h03。留空则自动扫描全部设备型号。
      required: false
      selector:
        text:
          multiple: true

refresh:
  name: 刷新面板
  description: 重新扫描设备树并重新生成 Lovelace 面板。
